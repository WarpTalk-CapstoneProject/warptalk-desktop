name: Release

# Cutting a release is what puts installers on https://warptalk.vn/download — that page reads
# the latest GitHub Release of this repo and links its assets directly. Tag and push to ship:
#
#   npm version minor && git push --follow-tags
#
# workflow_dispatch is for re-running a failed platform without moving the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not delete the assets the others already uploaded.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            build: npm run build:mac:remote
          - os: windows-latest
            name: Windows
            build: npm run build:win:remote
          - os: ubuntu-latest
            name: Linux
            build: npm run build:linux:remote

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A macOS build whose bundle is never re-sealed is not "unsigned", it is unopenable — the
      # Gatekeeper dialog offers only Move to Trash. Nothing downstream catches that: the build
      # goes green and the .dmg is the right size. Check the hook is wired before spending 20
      # minutes producing artifacts nobody can install.
      - name: Check macOS signing contract
        run: npm run check:mac-signing

      # Code signing is opt-in, and the certificates are not bought yet.
      #
      # These used to be listed directly in the build step's `env:`, on the assumption that an
      # unset secret would leave electron-builder unsigned. It does not. An unset secret expands
      # to the EMPTY STRING, and an empty CSC_LINK is still a *set* variable, so electron-builder
      # treats "" as a certificate path and fails:
      #
      #     ⨯ Env WIN_CSC_LINK is not correct, cannot resolve: D:\a\warptalk-desktop not a file
      #
      # There is no way to conditionally omit a key from a YAML `env:` block, so the variables are
      # exported here instead and only when they carry something. Values go through $GITHUB_ENV
      # rather than being echoed; the delimiter form is used because a PEM-style secret is
      # multi-line and would otherwise truncate at the first newline.
      - name: Enable code signing when certificates are configured
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT: ${{ secrets.WIN_CERTIFICATE_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          export_secret() {
            local name="$1" value="$2"
            printf '%s<<__WARPTALK_EOF__\n%s\n__WARPTALK_EOF__\n' "$name" "$value" >> "$GITHUB_ENV"
          }

          if [ -n "$MAC_CERT" ]; then
            export_secret CSC_LINK "$MAC_CERT"
            export_secret CSC_KEY_PASSWORD "$MAC_CERT_PASSWORD"
            echo "macOS: signing with the configured certificate."

            # Signing and notarizing are two different purchases of trust and they fail
            # differently. A signed-but-unnotarized download still stops at "Apple could not
            # verify WarpTalk is free of malware" — survivable, but only via Open Anyway, which
            # is not a thing to put in front of a demo audience. The notary service is what
            # removes the prompt, and it needs all three of these.
            if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
              export_secret APPLE_ID "$NOTARY_APPLE_ID"
              export_secret APPLE_APP_SPECIFIC_PASSWORD "$NOTARY_PASSWORD"
              export_secret APPLE_TEAM_ID "$NOTARY_TEAM_ID"
              echo "macOS: notarizing with the configured notary credentials."
            elif [ -n "$NOTARY_APPLE_ID$NOTARY_PASSWORD$NOTARY_TEAM_ID" ]; then
              # Two of three set is a typo in a secret name, and the build it would otherwise
              # produce looks finished and stops one row short of opening. Refuse here rather
              # than twenty minutes downstream.
              echo "macOS: notarization is half-configured. Set all three of APPLE_ID," >&2
              echo "       APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID, or none of them." >&2
              if [ -z "$NOTARY_APPLE_ID" ]; then echo "       missing: APPLE_ID" >&2; fi
              if [ -z "$NOTARY_PASSWORD" ]; then echo "       missing: APPLE_APP_SPECIFIC_PASSWORD" >&2; fi
              if [ -z "$NOTARY_TEAM_ID" ]; then echo "       missing: APPLE_TEAM_ID" >&2; fi
              exit 1
            else
              echo "macOS: signed but NOT notarized — no notary credentials configured. First"
              echo "        launch of a fresh download needs Open Anyway in System Settings >"
              echo "        Privacy & Security until APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and"
              echo "        APPLE_TEAM_ID are added."
            fi
          else
            # Without this electron-builder searches the runner keychain, finds nothing, and logs a
            # warning that reads like a failure. Saying "do not look" makes the unsigned build a
            # stated choice rather than an accident.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "macOS: no certificate configured, building UNSIGNED. The afterPack hook"
            echo "        (scripts/adhoc-sign-mac.js) still ad-hoc signs the bundle, without"
            echo "        which macOS reports the download as damaged and offers no way past it."
            echo "        The build stays unnotarized: first launch needs Open Anyway in System"
            echo "        Settings > Privacy & Security until MAC_CERTIFICATE_P12 is added."
          fi

          if [ -n "$WIN_CERT" ]; then
            export_secret WIN_CSC_LINK "$WIN_CERT"
            export_secret WIN_CSC_KEY_PASSWORD "$WIN_CERT_PASSWORD"
            echo "Windows: signing with the configured certificate."
          else
            echo "Windows: no certificate configured, building UNSIGNED. SmartScreen will warn"
            echo "         until WIN_CERTIFICATE_PFX is added."
          fi

      - name: Build and publish
        run: ${{ matrix.build }} -- --publish always
        env:
          # electron-builder reads this to create/update the GitHub Release named after the tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
