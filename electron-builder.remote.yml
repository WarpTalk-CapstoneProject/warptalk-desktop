appId: com.warptalk.desktop
productName: Warptalk-V1
copyright: Copyright (c) 2026 WarpTalk Team

directories:
  output: release
  buildResources: resources

extraResources:
  - from: resources/warptalk-logo-primary.ico
    to: warptalk-logo-primary.ico
  - from: resources/warptalk-logo-primary.png
    to: warptalk-logo-primary.png
  - from: resources/warptalk-tray.png
    to: warptalk-tray.png

mac:
  icon: resources/warptalk-logo-primary.png
  category: public.app-category.productivity
  # macos-latest runners are Apple Silicon, so building the host arch alone
  # would ship a dmg that refuses to launch on every Intel Mac.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true

win:
  icon: resources/warptalk-logo-primary.ico
  target:
    - nsis
    - portable

nsis:
  installerIcon: resources/warptalk-logo-primary.ico
  uninstallerIcon: resources/warptalk-logo-primary.ico
  shortcutName: Warptalk-V1

linux:
  icon: resources/warptalk-logo-primary.png
  target:
    - AppImage
    - deb
  category: Office

publish:
  provider: github
  owner: WarpTalk-CapstoneProject
  repo: warptalk-desktop
