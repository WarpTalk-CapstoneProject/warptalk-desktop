appId: com.warptalk.desktop
productName: WarpTalk
copyright: Copyright (c) 2026 WarpTalk Team

# Re-seals the macOS bundle with an ad-hoc signature. electron-builder leaves it half-signed when
# no certificate is configured, and macOS reports a half-signed bundle as "damaged and can't be
# opened" — a dialog with no way past it. See scripts/adhoc-sign-mac.js.
afterPack: scripts/adhoc-sign-mac.js

# Submits the signed bundle to Apple's notary service and staples the ticket, so a fresh download
# opens on a double click instead of stopping at "Apple could not verify". Runs only when a
# certificate was configured — electron-builder skips afterSign when no signing occurred — and
# no-ops without notary credentials. See scripts/notarize-mac.js.
afterSign: scripts/notarize-mac.js

# The URL scheme a plugin consent comes back through. Connecting a plugin opens the provider's
# consent screen in the system browser, so when it finishes the browser is holding the result and
# this app cannot see it; app.warptalk.io.vn/connect/<provider>/callback hands it back over this
# scheme. Registering it is a packaging concern - an unregistered scheme fails silently, with the
# browser simply doing nothing when the link is opened.
protocols:
  - name: WarpTalk
    schemes:
      - warptalk

directories:
  output: release
  buildResources: resources

extraResources:
  - from: ../warptalk-web/.next/standalone
    to: warptalk-web
  - from: ../warptalk-web/.next/static
    to: warptalk-web/.next/static
  - from: ../warptalk-web/public
    to: warptalk-web/public
  - from: resources/warptalk-logo-primary.ico
    to: warptalk-logo-primary.ico
  - from: resources/warptalk-logo-primary.png
    to: warptalk-logo-primary.png
  - from: resources/warptalk-tray.png
    to: warptalk-tray.png
  - from: resources/warptalk-tray-template.png
    to: warptalk-tray-template.png
  - from: resources/warptalk-tray-template@2x.png
    to: warptalk-tray-template@2x.png

mac:
  icon: resources/warptalk-logo-primary.png
  category: public.app-category.productivity
  # WarpTalk Microphone and WarpTalk Speaker, built from BlackHole's source by
  # scripts/build-mac-audio-driver.sh. The folder is committed with only a README, so a build that
  # skipped that step still packages and the app falls back to asking for upstream BlackHole.
  extraResources:
    - from: resources/audio-drivers
      to: audio-drivers
  # electron-builder supplies the microphone and camera strings by default but
  # not this one, and macOS refuses to capture a screen without it.
  extendInfo:
    NSScreenCaptureUsageDescription: >-
      Warptalk needs to record the screen so you can present it to the other
      people in a meeting.
    # Without this string macOS refuses Apple Events outright, with no prompt, and the Google Meet
    # sensor (src/main/meet-url-sensor-mac.ts) never sees a call.
    NSAppleEventsUsageDescription: >-
      WarpTalk checks whether your browser is showing a Google Meet call, so it
      can offer to translate it. It only reads the address of the tab you are
      looking at.
  # macos-latest runners are Apple Silicon, so building the host arch alone
  # would ship an installer that refuses to launch on every Intel Mac.
  #
  # .pkg, not .dmg, is what the download page hands out: a dmg can only copy the app, while the
  # pkg's postinstall (resources/pkg-scripts/postinstall) also adds WarpTalk Microphone and
  # WarpTalk Speaker, so downloading WarpTalk is the whole setup. The zip stays - it is what
  # electron-updater installs updates from.
  target:
    - target: pkg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  # The hardened runtime is inert on an ad-hoc signature, so these entitlements have done nothing
  # so far. They start being enforced the moment a Developer ID certificate signs the bundle, and
  # without the two device keys macOS denies the microphone and camera with no prompt and no error
  # the app can observe. Named explicitly rather than left to the buildResources lookup, so a
  # rename cannot quietly fall back to electron-builder's three-key default.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Notarization is done by the afterSign hook above, never by electron-builder itself. Left unset
  # with an APPLE_ID in the environment, electron-builder takes its legacy altool branch, which
  # sends no team id — and Apple decommissioned altool in 2023, so that fails after the upload
  # rather than before it.
  notarize: false

pkg:
  # Relative to buildResources (resources/). Must stay executable.
  scripts: pkg-scripts
  installLocation: /Applications
  # Always /Applications: the postinstall looks for the app there, and a relocated install would
  # leave it copying drivers from a path that does not exist.
  isRelocatable: false
  isVersionChecked: false
  allowAnywhere: false
  allowCurrentUserHome: false
  overwriteAction: upgrade

win:
  icon: resources/warptalk-logo-primary.ico
  target:
    - nsis
    - portable
  # VB-CABLE and Hi-Fi Cable plus the script that installs them; the installer runs it
  # (resources/installer.nsh). See resources/windows-audio-drivers/README.md.
  extraResources:
    - from: resources/windows-audio-drivers
      to: windows-audio-drivers

nsis:
  installerIcon: resources/warptalk-logo-primary.ico
  uninstallerIcon: resources/warptalk-logo-primary.ico
  shortcutName: WarpTalk
  include: resources/installer.nsh

linux:
  icon: resources/warptalk-logo-primary.png
  target:
    - AppImage
    - deb
  category: Office

publish:
  provider: github
  owner: WarpTalk-CapstoneProject
  repo: warptalk-desktop
  # electron-builder defaults to a DRAFT release. A draft is invisible to
  # GET /releases/latest (it 404s) and its asset URLs are not publicly
  # downloadable, so warptalk.vn/download — which reads exactly that endpoint —
  # would keep saying "coming soon" after a fully green build. Publish outright.
  releaseType: release
